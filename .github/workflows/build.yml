name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: actions/setup-android@v3
        with:
          api-level: 33      # 需与 app/build.gradle 的 compileSdk 一致
          build-tools: 33.0.2

      - name: Set up Gradle (System)
        uses: actions/setup-gradle@v2
        with:
          gradle-version: '8.4'

      - name: Build with System Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
